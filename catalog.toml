[[action]]
id = "spot-install-chrome"
name = "Install Google Chrome"
category = "install"
description = "Installs or updates Google Chrome with the latest version from the vendor. Shows the installed and latest version first, then asks: silent install, interactive install, or cancel. Note: Latest = the stable build at the widest rollout, which is what the enterprise MSI serves."
requires_admin = true
destructive = false
run = { type = "script", script = "install-chrome.ps1" }

